name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Public-surface audit
        run: go run ./cmd/publiccheck --repo . --all
      - name: Secret audit
        run: |
          go install github.com/gitleaks/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git --redact --log-opts="--all"
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
